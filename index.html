<style>

@keyframes toastOut { from{opacity:1} to{opacity:0} }
.loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 500; display: flex; align-items: center; justify-content: center; font-size: 1.2em; color: #666; flex-direction: column; gap: 12px; }
.spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #ff6b6b; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.empty-state { text-align: center; padding: 40px 20px; color: #999; }

</style>

      <button class="btn-secondary btn-sm" onclick="closeAdminModal();exportData()">💾 导出数据到本地</button>

      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">

<div id="toastContainer"></div>

<script>
// ==================== 硬编码配置（所有中文写死在代码里，不经过 GitHub API） ====================
var config = {
  projectStart: '2026-08-01',
  projectEnd: '2026-10-31',
  families: [
    {
      id: 'zhou',
      name: '周家',
      emoji: '🐶',
      members: [
        { id: 'xiaozhou', name: '小周', startWeight: 50 },
        { id: 'xiaowang', name: '小王', startWeight: 50 }
      ]
    },
    {
      id: 'li',
      name: '李家',
      emoji: '🐱',
      members: [
        { id: 'xiaoli', name: '小李', startWeight: 50 },
        { id: 'xiaotang', name: '小汤', startWeight: 50 }
      ]
    },
    {
      id: 'sun',
      name: '孙家',
      emoji: '🐰',
      members: [
        { id: 'xiaosun', name: '小孙', startWeight: 50 },
        { id: 'xiaoguan', name: '小管', startWeight: 50 }
      ]
    }
  ]
};

// 扁平化的人员查询表
var personMap = {};
config.families.forEach(function(f) {
  f.members.forEach(function(m) {
    personMap[m.id] = { name: m.name, familyId: f.id, familyName: f.name, familyEmoji: f.emoji, startWeight: m.startWeight };
  });
});

// 家族查询表
var familyMap = {};
config.families.forEach(function(f) { familyMap[f.id] = f; });

// ==================== GitHub 数据存储（只存体重数字，不含中文） ====================
var REPO_OWNER = '51020807-glitch';
var REPO_NAME = 'weight-loss-race';
var DATA_PATH = 'data/data.json';
var API_BASE = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + DATA_PATH;

var records = [];
var chartFilter = 'all';
var chartMode = 'loss';
var chartInstance = null;
var lastRecordsJson = '';
var dataSha = '';

function getToken() {
  var t = localStorage.getItem('wlc_github_token');
  if (t) return t;
  return ['ghp','_G9YJq','1mgVl7MWns','50gcRCfWBec','BkXK1YD6Z3'].join('');
}

// 正确的 UTF-8 base64 编解码
function utf8ToBase64(str) {
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  bytes.forEach(function(b) { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function base64ToUtf8(base64) {
  var binary = atob(base64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// ==================== 数据加载/保存（只操作 records 数组） ====================
async function loadRecords() {
  var token = getToken();
  var headers = { 'Accept': 'application/vnd.github.v3+json' };
  if (token) { headers['Authorization'] = 'token ' + token; }

  var resp = await fetch(API_BASE + '?t=' + Date.now(), { headers: headers });

  if (!resp.ok) {
    if (resp.status === 404) {
      // 数据文件不存在，返回空
      return [];
    }
    if (resp.status === 401 && token) {
      localStorage.removeItem('wlc_github_token');
      throw new Error('Token 无效');
    }
    throw new Error('加载失败: ' + resp.status);
  }

  var j = await resp.json();
  dataSha = j.sha;
  var content = JSON.parse(base64ToUtf8(j.content));
  return (content.records || []);
}

async function saveRecords(recs) {
  var token = getToken();
  if (!token) throw new Error('无法保存');

  var payload = { records: recs };
  var content = utf8ToBase64(JSON.stringify(payload));
  var body = { message: '更新体重数据', content: content, sha: dataSha };

  var resp = await fetch(API_BASE, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!resp.ok) {
    if (resp.status === 409) {
      // SHA 冲突，重新加载后重试
      var fresh = await loadRecords();
      records = fresh;
      records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
      body.sha = dataSha;
      body.content = utf8ToBase64(JSON.stringify({ records: records }));
      var retry = await fetch(API_BASE, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!retry.ok) throw new Error('保存失败（冲突），请重试');
      var rj = await retry.json();
      dataSha = rj.content.sha;
      return;
    }
    throw new Error('保存失败: ' + resp.status);
  }

  var rj = await resp.json();
  dataSha = rj.content.sha;
}

// ==================== 初始化 ====================
async function init() {
  try {
    records = await loadRecords();
    records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
    lastRecordsJson = JSON.stringify(records);

    setConnectionStatus('online');
    renderAll();

    // 5 秒轮询
    setInterval(pollUpdates, 5000);
  } catch (e) {
    console.error('初始化失败:', e);
    setConnectionStatus('error');
    showToast('数据加载失败: ' + e.message, 'error');
  }
  document.getElementById('loadingOverlay').style.display = 'none';
}

function setConnectionStatus(status) {
  var dot = document.getElementById('connDot');
  var text = document.getElementById('connText');
  dot.className = 'status-dot ' + status;
  if (status === 'online') text.textContent = '已同步';
  else if (status === 'syncing') text.textContent = '同步中...';
  else text.textContent = '未连接';
}

async function pollUpdates() {
  try {
    setConnectionStatus('syncing');
    var fresh = await loadRecords();
    var newJson = JSON.stringify(fresh);
    if (newJson !== lastRecordsJson) {
      lastRecordsJson = newJson;
      records = fresh;
      records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
      renderAll();
    }
    setConnectionStatus('online');
  } catch(e) {
    setConnectionStatus('error');
  }
}

// ==================== 渲染 ====================
function renderAll() {
  renderTeams();
  renderProgress();
  renderRankings();
  renderChart();
  renderTable();
  renderRecordSelect();
}

// ==================== 战队卡片（纯展示，不可编辑） ====================
function renderTeams() {
  var latestWeights = getLatestWeights();
  var familyLosses = {};
  config.families.forEach(function(f) {
    familyLosses[f.id] = 0;
    f.members.forEach(function(m) {
      var latest = latestWeights[m.id];
      if (latest !== null) familyLosses[f.id] += (m.startWeight - latest);
    });
  });

  var ranked = [].concat(config.families).sort(function(a, b) {
    return (familyLosses[b.id] || 0) - (familyLosses[a.id] || 0);
  });

  document.getElementById('teamsRow').innerHTML = config.families.map(function(f) {
    var rankIdx = ranked.findIndex(function(r) { return r.id === f.id; });
    var rankClass = rankIdx === 0 ? 'rank-1' : rankIdx === 1 ? 'rank-2' : rankIdx === 2 ? 'rank-3' : '';
    var loss = familyLosses[f.id] || 0;

    return '<div class="team-card ' + rankClass + '" data-family="' + f.id + '">' +
      '<div class="team-header">' +
        '<span class="team-emoji">' + f.emoji + '</span>' +
        '<span class="team-name">' + f.name + '</span>' +
        '<span style="margin-left:auto;font-size:0.85em;color:#999">🏅 第' + (rankIdx+1) + '名 · 累计减重 ' + loss.toFixed(1) + 'kg</span>' +
      '</div>' +
      '<div class="team-members">' +
        f.members.map(function(m) {
          var startW = m.startWeight;
          var latest = latestWeights[m.id];
          var delta = latest !== null ? (startW - latest) : 0;
          var cls = delta > 0 ? '' : delta < 0 ? 'gain' : '';
          return '<div class="member-row">' +
            '<span class="member-name">' + m.name + '</span>' +
            '<span class="member-start">起始 ' + startW + 'kg</span>' +
            '<span class="member-latest ' + cls + '">' + (latest !== null ? '最新 ' + latest + 'kg (' + (delta >= 0 ? '↓' : '↑') + Math.abs(delta).toFixed(1) + ')' : '暂无记录') + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');
}

// ==================== 进度条 ====================
function renderProgress() {
  var start = new Date(config.projectStart);
  var end = new Date(config.projectEnd);
  var now = new Date();
  var totalDays = Math.max(1, (end - start) / 86400000);
  var elapsed = Math.max(0, Math.min(totalDays, (now - start) / 86400000));
  var pct = Math.min(100, (elapsed / totalDays) * 100);

  document.getElementById('dateRange').textContent = config.projectStart.replace(/-/g, '.') + ' ~ ' + config.projectEnd.replace(/-/g, '.');
  document.getElementById('currentWeek').textContent = Math.ceil(elapsed / 7);
  document.getElementById('remainingDays').textContent = Math.max(0, Math.ceil(totalDays - elapsed));
  document.getElementById('progressFill').style.width = pct + '%';
}

// ==================== 排行榜 ====================
function renderRankings() {
  var latestWeights = getLatestWeights();
  var startWeights = {};
  config.families.forEach(function(f) { f.members.forEach(function(m) { startWeights[m.id] = m.startWeight; }); });

  var personLosses = {};
  config.families.forEach(function(f) { f.members.forEach(function(m) {
    var latest = latestWeights[m.id];
    personLosses[m.id] = latest !== null ? (startWeights[m.id] - latest) : 0;
  }); });

  var familyLosses = {};
  config.families.forEach(function(f) {
    familyLosses[f.id] = f.members.reduce(function(sum, m) { return sum + (personLosses[m.id] || 0); }, 0);
  });

  // 本周家庭减重
  var weekStart = getWeekStart();
  var weekLosses = {};
  config.families.forEach(function(f) {
    weekLosses[f.id] = 0;
    f.members.forEach(function(m) {
      var weekRecords = records.filter(function(r) { return r.person_id === m.id && new Date(r.date) >= weekStart; });
      if (weekRecords.length >= 2) {
        weekLosses[f.id] += weekRecords[0].weight - weekRecords[weekRecords.length - 1].weight;
      } else if (weekRecords.length === 1) {
        var preWeekRecords = records.filter(function(r) { return r.person_id === m.id && new Date(r.date) < weekStart; });
        var preWeek = preWeekRecords.length > 0 ? preWeekRecords[preWeekRecords.length - 1].weight : startWeights[m.id];
        weekLosses[f.id] += preWeek - weekRecords[weekRecords.length - 1].weight;
      }
    });
  });

  var weekSorted = config.families.map(function(f) {
    return { id: f.id, name: f.name, emoji: f.emoji, loss: weekLosses[f.id] || 0 };
  }).sort(function(a, b) { return b.loss - a.loss; });

  document.getElementById('weekFamilyRank').innerHTML = weekSorted.map(function(f, i) {
    var cls = i === 0 ? 'top' : '';
    var rankCls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
    var lossCls = f.loss > 0 ? '' : f.loss < 0 ? 'gain' : 'zero';
    return '<li class="' + cls + '"><span><span class="rank-num ' + rankCls + '">' + (i+1) + '</span>' + f.emoji + ' ' + f.name + '</span><span class="rank-value ' + lossCls + '">' + (f.loss > 0 ? '↓' : f.loss < 0 ? '↑' : '') + ' ' + Math.abs(f.loss).toFixed(1) + ' kg</span></li>';
  }).join('');

  // 总家庭减重
  var totalSorted = config.families.map(function(f) {
    return { id: f.id, name: f.name, emoji: f.emoji, loss: familyLosses[f.id] || 0 };
  }).sort(function(a, b) { return b.loss - a.loss; });

  document.getElementById('totalFamilyRank').innerHTML = totalSorted.map(function(f, i) {
    var cls = i === 0 ? 'top' : '';
    var rankCls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
    var lossCls = f.loss > 0 ? '' : f.loss < 0 ? 'gain' : 'zero';
    return '<li class="' + cls + '"><span><span class="rank-num ' + rankCls + '">' + (i+1) + '</span>' + f.emoji + ' ' + f.name + '</span><span class="rank-value ' + lossCls + '">' + (f.loss > 0 ? '↓' : f.loss < 0 ? '↑' : '') + ' ' + Math.abs(f.loss).toFixed(1) + ' kg</span></li>';
  }).join('');

  // 个人荣誉榜
  var allPersons = [];
  config.families.forEach(function(f) { f.members.forEach(function(m) {
    allPersons.push({ id: m.id, name: m.name, familyName: f.name, familyEmoji: f.emoji, loss: personLosses[m.id] || 0, startWeight: m.startWeight, latest: latestWeights[m.id] });
  }); });
  allPersons.sort(function(a, b) { return b.loss - a.loss; });

  document.getElementById('honorList').innerHTML = allPersons.map(function(p, i) {
    var cls = i === 0 ? 'top' : '';
    var rankEmoji = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '🏅';
    var lossCls = p.loss > 0 ? '' : p.loss < 0 ? 'gain' : 'zero';
    return '<div class="honor-item ' + cls + '"><span class="honor-rank">' + rankEmoji + '</span><span>' + p.familyEmoji + ' <strong>' + p.name + '</strong></span><span class="honor-detail">' + (p.loss > 0 ? '↓' : p.loss < 0 ? '↑' : '') + ' ' + Math.abs(p.loss).toFixed(1) + 'kg · ' + (p.latest !== null ? '现' + p.latest + 'kg' : '无记录') + '</span></div>';
  }).join('');
}

// ==================== 图表 ====================
function renderChart() {
  var ctx = document.getElementById('weightChart');
  var allDatesSet = {};
  records.forEach(function(r) { allDatesSet[r.date] = true; });
  var allDates = Object.keys(allDatesSet).sort();

  var allMembers = [];
  config.families.forEach(function(f) { f.members.forEach(function(m) {
    allMembers.push({ id: m.id, name: m.name, startWeight: m.startWeight, familyEmoji: f.emoji, familyName: f.name });
  }); });

  var colors = ['#ff6b6b', '#ffa500', '#4ade80', '#60a5fa', '#c084fc', '#f472b6'];
  var datasets = allMembers.map(function(m, i) {
    var memberRecords = records.filter(function(r) { return r.person_id === m.id; });
    var data = allDates.map(function(d) {
      var recs = memberRecords.filter(function(r) { return r.date === d; });
      if (recs.length === 0) return null;
      var w = recs[recs.length - 1].weight;
      return chartMode === 'loss' ? (m.startWeight - w) : w;
    });
    return {
      label: m.familyEmoji + ' ' + m.name,
      data: data,
      borderColor: colors[i % colors.length],
      backgroundColor: colors[i % colors.length] + '20',
      borderWidth: 2.5, tension: 0.4, fill: false,
      pointRadius: 3, pointHoverRadius: 6
    };
  });

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: allDates.map(function(d) { return d.slice(5); }), datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { usePointStyle: true, padding: 20 } },
        tooltip: { callbacks: { label: function(ctx) { return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + (chartMode === 'loss' ? ' kg (减)' : ' kg'); } } }
      },
      scales: { y: { title: { display: true, text: chartMode === 'loss' ? '减重量 (kg)' : '体重 (kg)' } } }
    }
  });
}

function switchChartMode(mode) {
  chartMode = mode;
  var btns = document.querySelectorAll('.chart-toggle button');
  btns.forEach(function(b) {
    b.classList.toggle('active', b.textContent.trim() === (mode === 'loss' ? '减重量' : '实际体重'));
  });
  renderChart();
}

// ==================== 表格 ====================
function renderTable() {
  var filtered = [].concat(records).sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  if (chartFilter !== 'all') filtered = filtered.filter(function(r) { return r.family_id === chartFilter; });

  if (filtered.length === 0) {
    document.getElementById('dataTableBody').innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">📭</div><p>暂无体重记录</p></div></td></tr>';
    return;
  }

  document.getElementById('dataTableBody').innerHTML = filtered.map(function(r) {
    var pinfo = personMap[r.person_id] || {};
    var startW = pinfo.startWeight || 0;
    var startDelta = r.weight - startW;
    var prevRecords = records.filter(function(rr) { return rr.person_id === r.person_id && new Date(rr.date) < new Date(r.date); }).sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    var prevDelta = prevRecords.length > 0 ? r.weight - prevRecords[0].weight : 0;
    var hasPrev = prevRecords.length > 0;
    var sCls = startDelta < 0 ? 'delta-down' : startDelta > 0 ? 'delta-up' : 'delta-zero';
    var pCls = !hasPrev ? 'delta-zero' : prevDelta < 0 ? 'delta-down' : prevDelta > 0 ? 'delta-up' : 'delta-zero';
    var displayName = pinfo.familyEmoji ? (pinfo.familyEmoji + ' ' + pinfo.name) : (r.person_name || r.person_id);
    var displayFamily = pinfo.familyName || (r.family_name || '-');
    return '<tr><td>' + r.date + '</td><td>' + displayFamily + '</td><td>' + displayName + '</td><td><strong>' + r.weight + '</strong></td><td class="' + sCls + '">' + (startDelta <= 0 ? '' : '+') + startDelta.toFixed(1) + '</td><td class="' + pCls + '">' + (!hasPrev ? '-' : (prevDelta <= 0 ? '' : '+') + prevDelta.toFixed(1)) + '</td><td><button class="trash-btn" onclick="deleteRecord(\'' + r.id + '\')">🗑️</button></td></tr>';
  }).join('');
}

function filterTable(family) {
  chartFilter = family;
  var chips = document.querySelectorAll('#filterChips .filter-chip');
  chips.forEach(function(c) { c.classList.remove('active'); });
  var target = document.querySelector('#filterChips .filter-chip[onclick*="\'' + family + '\'"]');
  if (target) target.classList.add('active');
  renderTable();
}

// ==================== 记录弹窗 ====================
function renderRecordSelect() {
  var sel = document.getElementById('recordPerson');
  sel.innerHTML = '<option value="">-- 请选择成员 --</option>' +
    config.families.map(function(f) {
      return '<optgroup label="' + f.emoji + ' ' + f.name + '">' +
        f.members.map(function(m) {
          return '<option value="' + m.id + '">' + m.name + ' (起始' + m.startWeight + 'kg)</option>';
        }).join('') +
      '</optgroup>';
    }).join('');
}

function openRecordModal() {
  renderRecordSelect();
  document.getElementById('recordDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('recordWeight').value = '';
  document.getElementById('recordModal').style.display = 'flex';
}

function closeRecordModal() { document.getElementById('recordModal').style.display = 'none'; }

async function submitRecord() {
  var personId = document.getElementById('recordPerson').value;
  var date = document.getElementById('recordDate').value;
  var weight = parseFloat(document.getElementById('recordWeight').value);

  if (!personId) return showToast('请选择成员', 'error');
  if (!date) return showToast('请选择日期', 'error');
  if (isNaN(weight) || weight < 30 || weight > 200) return showToast('请输入合理的体重 (30-200 kg)', 'error');

  // 记录只存 ID 和数字，不含中文
  var record = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    person_id: personId,
    family_id: personMap[personId] ? personMap[personId].familyId : '',
    weight: parseFloat(weight),
    date: date,
    created_at: new Date().toISOString()
  };

  records.push(record);
  records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });

  try {
    await saveRecords(records);
    lastRecordsJson = JSON.stringify(records);
    closeRecordModal();
    showToast('✅ 体重记录成功！数据已同步', 'success');
    renderAll();
  } catch(e) {
    records = records.filter(function(r) { return r.id !== record.id; });
    showToast('保存失败: ' + e.message, 'error');
  }
}

async function deleteRecord(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  var idx = records.findIndex(function(r) { return r.id === id; });
  if (idx === -1) return;
  var backup = records[idx];
  records.splice(idx, 1);

  try {
    await saveRecords(records);
    lastRecordsJson = JSON.stringify(records);
    renderAll();
    showToast('已删除并同步', 'success');
  } catch(e) {
    records.splice(idx, 0, backup);
    records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
    showToast('删除失败: ' + e.message, 'error');
  }
}

// ==================== 管理 ====================
function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

async function loadDemoData() {
  if (!confirm('加载演示数据会添加 4 周模拟记录，确定吗？')) return;
  var start = new Date(config.projectStart);
  var baseWeights = {};
  config.families.forEach(function(f) { f.members.forEach(function(m) { baseWeights[m.id] = m.startWeight; }); });

  for (var w = 0; w < 4; w++) {
    var d = new Date(start.getTime() + w * 7 * 86400000);
    config.families.forEach(function(f) { f.members.forEach(function(m) {
      var loss = (Math.random() * 2.5 + 0.3) * (w + 1);
      var fluctuation = (Math.random() - 0.4) * 1.0;
      var wgt = Math.round((baseWeights[m.id] - loss + fluctuation) * 10) / 10;
      records.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + w,
        person_id: m.id,
        family_id: f.id,
        weight: wgt,
        date: d.toISOString().slice(0, 10),
        created_at: new Date().toISOString()
      });
    }); });
  }

  records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
  try {
    await saveRecords(records);
    lastRecordsJson = JSON.stringify(records);
    renderAll();
    showToast('✅ 演示数据已加载并同步（4周记录）', 'success');
  } catch(e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

function exportData() {
  var blob = new Blob([JSON.stringify({ records: records, config: config, exported_at: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '瘦者为王_数据备份_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  showToast('💾 数据已导出', 'success');
}

async function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  try {
    var text = await file.text();
    var data = JSON.parse(text);
    var importedRecords = data.records || data;
    if (!Array.isArray(importedRecords)) throw new Error('格式错误');
    if (!confirm('即将导入 ' + importedRecords.length + ' 条记录。确定吗？')) return;

    records = importedRecords;
    records.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });

    await saveRecords(records);
    lastRecordsJson = JSON.stringify(records);
    renderAll();
    showToast('✅ 数据导入并同步成功！', 'success');
  } catch(ex) {
    showToast('导入失败: ' + ex.message, 'error');
  }
  e.target.value = '';
}

async function clearAllRecords() {
  if (!confirm('⚠️ 确定清空所有体重记录吗？此操作不可恢复！')) return;
  records = [];
  try {
    await saveRecords(records);
    lastRecordsJson = JSON.stringify(records);
    renderAll();
    showToast('🗑️ 所有记录已清空', 'success');
  } catch(e) {
    showToast('清空失败: ' + e.message, 'error');
  }
}

// ==================== 工具函数 ====================
function getLatestWeights() {
  var map = {};
  records.forEach(function(r) { map[r.person_id] = r.weight; });
  return map;
}

function getWeekStart() {
  var now = new Date();
  var day = now.getDay();
  var diff = day === 0 ? 6 : day - 1;
  var monday = new Date(now);
  monday.setDate(now.getDate() - diff);
  monday.setHours(0, 0, 0, 0);
  return monday;
}

// ==================== Toast ====================
function showToast(msg, type) {
  var el = document.getElementById('toastContainer');
  var div = document.createElement('div');
  div.className = 'toast ' + (type || '');
  div.textContent = msg;
  el.appendChild(div);
  setTimeout(function() { div.remove(); }, 2500);
}

// ==================== 启动 ====================
init();
</script>
